name: tests

on: 
    push:
    workflow_dispatch: # adds a "Run workflow" button on the Actions tab

jobs:
    api-tests:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api
        steps:
            -   uses: actions/checkout@v6   # download the repo onto GitHub's machine
            -   uses: actions/setup-python@v7   # install Python
                with:
                    python-version: "3.12"  # same version as the Docker image
            -   run: pip install -r requirements-dev.txt
            -   run: python -m pytest